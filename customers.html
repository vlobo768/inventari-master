<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Gestión de Clientes - Inventario</title>
  <link rel="stylesheet" href="assets/styles.css?v=glass_1777557272107">
  <style>
    body {
      flex-direction: column;
      justify-content: flex-start;
      padding: 40px;
      overflow-y: auto;
      height: auto;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.8s ease-out;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
    }

    .header h1 {
      color: #00d2ff;
      font-size: 24px;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      outline: none;
    }

    .search-box input:focus {
      border-color: #00d2ff;
    }


    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #fff;
      font-size: 14px;
    }

    th {
      text-align: left;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      color: #00d2ff;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    }

    td {
      padding: 12px 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-pay { background: #48bb78; color: white; }
    .btn-pay:hover { background: #38a169; }
    .btn-history { background: #ecc94b; color: #1a202c; }
    .btn-history:hover { background: #d69e2e; }

    /* Historial Table */
    .history-table {
      width: 100%;
      margin-top: 10px;
      font-size: 12px;
      border-collapse: collapse;
    }
    .history-table th { font-size: 11px; padding: 8px; }
    .history-table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .status-badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }
    .status-pending { background: rgba(246, 173, 85, 0.2); color: #f6ad55; }
    .status-paid { background: rgba(72, 187, 120, 0.2); color: #48bb78; }

    /* Modal wide for history */
    .modal-content.wide {
      width: 800px;
      max-width: 95%;
    }

    .history-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }
    .tab-btn {
      background: none;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 4px;
    }
    .tab-btn.active {
      background: rgba(0, 210, 255, 0.2);
      color: #00d2ff;
    }

    /* Modals */







    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #paymentModal, #customerModal {
      z-index: 1100;
    }

    .modal-content {
      background: #1a2a3a;
      padding: 30px;
      border-radius: 20px;
      width: 500px;
      max-width: 90%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: modalFadeIn 0.3s ease-out;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      color: #00d2ff;
      font-size: 20px;
    }

    .close-modal {
      font-size: 24px;
      cursor: pointer;
      color: #a0aec0;
    }

    .modal-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: end;
    }

    .modal-form .form-group {
      display: flex;
      flex-direction: column;
    }

    .modal-form .form-group.full {
      grid-column: span 2;
    }

    .modal-form label {
      font-size: 12px;
      color: #cbd5e0;
      margin-bottom: 8px;
      text-align: left;
    }

    .modal-form input,
    .modal-form select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      outline: none;
      width: 100%;
      box-sizing: border-box;
    }

    .modal-footer {
      margin-top: 30px;
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      grid-column: span 2;
    }




    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header">
      <h1>Gestión de Clientes</h1>
      <div class="nav-buttons">
        <button id="btnToggleSelection" class="btn-nav"
          style="background: linear-gradient(90deg, #34495e 0%, #2c3e50 100%);"
          onclick="toggleSelectionMode()">Seleccionar</button>
        <button class="btn-nav" onclick="window.location.href='dashboard.html'">Atrás</button>
        <button class="btn-nav" style="background: linear-gradient(90deg, #2ecc71 0%, #27ae60 100%);"
          onclick="window.location.href='ventas.html'">NUEVA VENTA</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchCustomer" placeholder="Buscar por nombre, cédula o teléfono..."
          oninput="loadCustomers()">
      </div>
      <button class="btn-add" onclick="openCustomerModal()">+ Nuevo Cliente</button>
    </div>

    <div class="table-container">
      <table id="customersTable">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Cédula</th>
            <th>Teléfono</th>
            <th>Límite Crédito</th>
            <th>Deuda</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Cargado dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Cliente -->
  <div id="customerModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nuevo Cliente</h2>
        <span class="close-modal" onclick="closeCustomerModal()">&times;</span>
      </div>
      <form id="customerForm" class="modal-form">
        <input type="hidden" id="customerId">
        <div class="form-group full">
          <label>Nombre Completo</label>
          <input type="text" id="custName" required>
        </div>
        <div class="form-group">
          <label>Cédula de Identidad</label>
          <input type="text" id="custCedula" placeholder="V-12345678">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" id="custPhone">
        </div>
        <div class="form-group full">
          <label>Dirección</label>
          <input type="text" id="custAddress">
        </div>
        <div class="form-group full">
          <label>Límite de Crédito ($)</label>
          <input type="number" step="0.01" id="custCredit" value="0.00">
        </div>
        <div class="modal-footer full">
          <button type="button" class="btn-cancel" onclick="closeCustomerModal()">Cancelar</button>
          <button type="submit" class="btn-save">Guardar Cliente</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Modal Pago -->
  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Registrar Pago / Abono</h2>
        <span class="close-modal" onclick="closePaymentModal()">&times;</span>
      </div>
      <form id="paymentForm" class="modal-form">
        <input type="hidden" id="payCustId">
        <input type="hidden" id="paySaleId">
        <div class="form-group full">
          <label>Cliente</label>
          <input type="text" id="payCustName" readonly>
        </div>
        <div class="form-group">
          <label>Deuda Actual</label>
          <input type="text" id="payCurrentDebt" readonly>
        </div>
        <div class="form-group">
          <label>Monto a Abonar ($)</label>
          <input type="number" step="0.01" id="payAmount" required>
        </div>
        <div class="form-group full">
          <label>Nota / Referencia (Opcional)</label>
          <input type="text" id="payNote" placeholder="Ej: Pago transferencia #123">
        </div>
        <div class="modal-footer full">
          <button type="button" class="btn-cancel" onclick="closePaymentModal()">Cancelar</button>
          <button type="submit" class="btn-save">Confirmar Pago</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Historial -->
  <div id="historyModal" class="modal">
    <div class="modal-content wide">
      <div class="modal-header">
        <h2 id="historyTitle">Historial de Crédito</h2>
        <span class="close-modal" onclick="closeHistoryModal()">&times;</span>
      </div>
      
      <div class="history-tabs">
        <button id="tabSalesBtn" class="tab-btn active" onclick="switchHistoryTab('sales')">Ventas Pendientes</button>
        <button id="tabPaymentsBtn" class="tab-btn" onclick="switchHistoryTab('payments')">Historial de Pagos</button>
      </div>

      <div id="historySales" class="tab-content">
        <div class="table-container" style="max-height: 400px;">
          <table class="history-table">
            <thead>
              <tr>
                <th>ID Venta</th>
                <th>Fecha</th>
                <th>Productos</th>
                <th>Total</th>
                <th>Saldo</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="historySalesBody"></tbody>
          </table>
        </div>
      </div>

      <div id="historyPayments" class="tab-content" style="display:none;">
        <div class="table-container" style="max-height: 400px;">
          <table class="history-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Monto</th>
                <th>Nota</th>
              </tr>
            </thead>
            <tbody id="historyPaymentsBody"></tbody>
          </table>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" onclick="closeHistoryModal()">Cerrar</button>
      </div>
    </div>
  </div>
  <script>
    // RBAC check
    const userStr = localStorage.getItem("currentUser");
    if (!userStr) {
      window.location.href = "index.html";
    } else {
      const user = JSON.parse(userStr);
      const userLevel = user.user_level || user.level;
      if (userLevel != 1 && userLevel != 2 && userLevel != 3) {
        alert("Acceso denegado.");
        window.location.href = "dashboard.html";
      }
    }

    async function loadCustomers() {
      const search = document.getElementById('searchCustomer').value;
      const response = await window.api.apiCall('customers', 'getAllCustomers', { search });

      if (response.success) {
        const customers = response.data;
        const tbody = document.querySelector('#customersTable tbody');
        tbody.innerHTML = '';

        customers.forEach(c => {
          const row = document.createElement('tr');

          const userStr = localStorage.getItem("currentUser");
          const user = userStr ? JSON.parse(userStr) : {};
          const userLevel = user.user_level || user.level;

          row.innerHTML = `
            <td>${c.name}</td>
            <td>${c.cedula || 'N/A'}</td>
            <td>${c.phone || 'N/A'}</td>
            <td>$${parseFloat(c.credit_limit || 0).toFixed(2)}</td>
            <td style="color: ${parseFloat(c.debt) > 0 ? '#f6ad55' : '#48bb78'}">$${parseFloat(c.debt || 0).toFixed(2)}</td>
            <td class="actions">
              <button class="btn-action btn-history" onclick="openHistory(${c.id}, '${c.name}')">Historial</button>
              <button class="btn-action btn-edit" onclick="editCustomer(${c.id})">Editar</button>
              ${userLevel == 1 || userLevel == 2 ? `<button class="btn-action btn-delete" onclick="deleteCustomer(${c.id})">Eliminar</button>` : ''}
            </td>
          `;
          tbody.appendChild(row);
        });
      }
    }

    function openCustomerModal(custId = null) {
      const userStr = localStorage.getItem("currentUser");
      const user = userStr ? JSON.parse(userStr) : {};
      const userLevel = user.user_level || user.level;

      if (userLevel != 1 && userLevel != 2 && userLevel != 3) {
        alert("No tienes permisos para añadir o editar clientes.");
        return;
      }

      const modal = document.getElementById('customerModal');
      const form = document.getElementById('customerForm');
      const title = document.getElementById('modalTitle');

      form.reset();
      document.getElementById('customerId').value = '';

      if (custId) {
        title.innerText = 'Editar Cliente';
        loadCustomerData(custId);
      } else {
        title.innerText = 'Nuevo Cliente';
      }

      modal.style.display = 'flex';
    }

    async function loadCustomerData(id) {
      const response = await window.api.apiCall('customers', 'getCustomerById', id);
      if (response.success && response.data) {
        const c = response.data;
        document.getElementById('customerId').value = c.id;
        document.getElementById('custName').value = c.name;
        document.getElementById('custCedula').value = c.cedula || '';
        document.getElementById('custPhone').value = c.phone || '';
        document.getElementById('custAddress').value = c.address || '';
        document.getElementById('custCredit').value = c.credit_limit || 0;
      }
    }

    function closeCustomerModal() {
      document.getElementById('customerModal').style.display = 'none';
      document.getElementById('customerForm').reset();
    }

    document.getElementById('customerForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('customerId').value;
      const data = {
        name: document.getElementById('custName').value,
        cedula: document.getElementById('custCedula').value,
        phone: document.getElementById('custPhone').value,
        address: document.getElementById('custAddress').value,
        credit_limit: parseFloat(document.getElementById('custCredit').value)
      };

      const method = id ? 'updateCustomer' : 'addCustomer';
      const payload = id ? { id: parseInt(id), ...data } : data;

      const response = await window.api.apiCall('customers', method, payload);
      if (response.success) {
        closeCustomerModal();
        loadCustomers();
      } else {
        alert("Error: " + response.message);
      }
    };

    async function deleteCustomer(id) {
      if (confirm("¿Estás seguro de eliminar este cliente?")) {
        const response = await window.api.apiCall('customers', 'deleteCustomer', id);
        if (response.success) {
          loadCustomers();
        } else {
          alert("Error: " + response.message);
        }
      }
    }

    // ✅ FIX: función editCustomer faltante
    function editCustomer(id) {
      openCustomerModal(id);
    }

    // ✅ GESTIÓN DE PAGOS Y ABONOS
    function openPayment(id, name, debt, saleId = null) {
      document.getElementById('payCustId').value = id;
      document.getElementById('paySaleId').value = saleId || '';
      document.getElementById('payCustName').value = name + (saleId ? ` (Venta #${saleId})` : '');
      document.getElementById('payCurrentDebt').value = `$${parseFloat(debt).toFixed(2)}`;
      document.getElementById('payAmount').value = '';
      document.getElementById('payAmount').max = debt;
      document.getElementById('paymentModal').style.display = 'flex';
    }

    function closePaymentModal() {
      document.getElementById('paymentModal').style.display = 'none';
    }

    document.getElementById('paymentForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('payCustId').value;
      const saleId = document.getElementById('paySaleId').value;
      const amount = parseFloat(document.getElementById('payAmount').value);
      const note = document.getElementById('payNote').value;

      const response = await window.api.apiCall('customers', 'addPayment', parseInt(id), amount, note, saleId ? parseInt(saleId) : null);
      if (response.success) {
        alert("Pago registrado con éxito");
        closePaymentModal();
        await loadCustomers(); // Esperar a que cargue la tabla principal
        
        // ✅ ACTUALIZACIÓN DINÁMICA: Si el historial está abierto, refrescarlo también
        const historyModal = document.getElementById('historyModal');
        if (historyModal.style.display === 'flex' && window.currentHistoryId) {
          const currentHistoryName = document.getElementById('historyTitle').innerText.replace('Historial: ', '');
          await refreshHistory(window.currentHistoryId, currentHistoryName);
        }
      } else {
        alert("Error: " + response.error);
      }
    };

    // Función para refrescar el historial sin cerrar el modal
    async function refreshHistory(id, name) {
      const response = await window.api.apiCall('customers', 'getCreditHistory', id);
      if (response.success) {
        renderHistorySales(response.sales);
        renderHistoryPayments(response.payments);
      }
    }

    // ✅ GESTIÓN DE HISTORIAL
    async function openHistory(id, name) {
      window.currentHistoryId = id; // Guardar ID globalmente para refrescos posteriores
      document.getElementById('historyTitle').innerText = `Historial: ${name}`;
      const response = await window.api.apiCall('customers', 'getCreditHistory', id);
      if (response.success) {
        renderHistorySales(response.sales);
        renderHistoryPayments(response.payments);
        switchHistoryTab('sales');
        document.getElementById('historyModal').style.display = 'flex';
      } else {
        alert("Error al cargar historial: " + response.error);
      }
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').style.display = 'none';
    }

    async function switchHistoryTab(tab) {
      document.getElementById('historySales').style.display = tab === 'sales' ? 'block' : 'none';
      document.getElementById('historyPayments').style.display = tab === 'payments' ? 'block' : 'none';
      
      document.getElementById('tabSalesBtn').classList.toggle('active', tab === 'sales');
      document.getElementById('tabPaymentsBtn').classList.toggle('active', tab === 'payments');

      // ✅ ACTUALIZACIÓN AL HACER CLICK: Recargar datos para asegurar que estén frescos
      const titleText = document.getElementById('historyTitle').innerText;
      const customerName = titleText.replace('Historial: ', '');
      // El ID no está fácilmente disponible aquí, lo buscaremos en el objeto global o lo extraeremos
      // Para mayor robustez, guardaremos el currentHistoryId globalmente al abrir el historial
      if (window.currentHistoryId) {
        await refreshHistory(window.currentHistoryId, customerName);
      }
    }

    function renderHistorySales(sales) {
      const tbody = document.getElementById('historySalesBody');
      tbody.innerHTML = '';
      if (!sales || sales.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No hay ventas a crédito pendientes.</td></tr>';
        return;
      }
      sales.forEach(s => {
        // Necesitamos el nombre del cliente para el modal de pago
        const name = document.getElementById('historyTitle').innerText.replace('Historial: ', '');
        const row = `<tr>
          <td>#${s.id}</td>
          <td>${new Date(s.date).toLocaleString()}</td>
          <td>${s.products}</td>
          <td>$${parseFloat(s.total).toFixed(2)}</td>
          <td style="color: #f6ad55; font-weight: bold;">$${parseFloat(s.pending_amount).toFixed(2)}</td>
          <td>
            <button class="btn-action btn-pay" onclick="openPayment(${s.customer_id || 'null'}, '${name}', ${s.pending_amount}, ${s.id})">Abonar</button>
          </td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    function renderHistoryPayments(payments) {
      const tbody = document.getElementById('historyPaymentsBody');
      tbody.innerHTML = '';
      if (!payments || payments.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No se han registrado pagos.</td></tr>';
        return;
      }
      payments.forEach(p => {
        const row = `<tr>
          <td>${new Date(p.date).toLocaleString()}</td>
          <td style="color: #48bb78; font-weight: bold;">$${parseFloat(p.amount).toFixed(2)}</td>
          <td>${p.note || '---'}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    // ✅ FIX: Escape y click en backdrop para cerrar modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeCustomerModal();
        closePaymentModal();
        closeHistoryModal();
      }
    });

    document.querySelectorAll('.modal').forEach(m => {
      m.addEventListener('click', (e) => {
        if (e.target === m) {
          closeCustomerModal();
          closePaymentModal();
          closeHistoryModal();
        }
      });
    });

    window.onload = loadCustomers;
  </script>
</body>

</html>

</content>
