<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Clientes - Inventario</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    body {
      flex-direction: column;
      justify-content: flex-start;
      padding: 40px;
      overflow-y: auto;
      height: auto;
    }
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.8s ease-out;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 15px;
    }
    .header h1 {
      color: #00d2ff;
      font-size: 24px;
    }
    .nav-buttons { display: flex; gap: 10px; }
.btn-nav { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.3s ease; } .btn-nav:hover { background: #00d2ff; color: #000; box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }
    .search-box input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      outline: none;
    }
    .search-box input:focus {
      border-color: #00d2ff;
    }
    .btn-add {
      background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-add:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      color: #fff;
      font-size: 14px;
    }
    th {
      text-align: left;
      padding: 15px;
      background: rgba(255,255,255,0.1);
      color: #00d2ff;
      border-bottom: 2px solid rgba(255,255,255,0.1);
    }
    td {
      padding: 12px 15px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    tr:hover {
      background: rgba(255,255,255,0.03);
    }
    .actions { display: flex; gap: 10px; }
.btn-action { padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; cursor: pointer; font-size: 11px; transition: all 0.2s; } .btn-edit:hover { background: #3498db; border-color: #3498db; } .btn-delete:hover { background: #e74c3c; border-color: #e74c3c; } .btn-status:hover { background: #f39c12; border-color: #f39c12; }
    .btn-action {-radius: 0; margin-left: -1px;}
    
    
    .btn-edit:hover { background: #3498db; border-color: #3498db; }
    .btn-delete:hover { background: #e74c3c; border-color: #e74c3c; }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #1a2a3a;
      padding: 30px;
      border-radius: 20px;
      width: 500px;
      max-width: 90%;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      animation: modalFadeIn 0.3s ease-out;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 { color: #00d2ff; font-size: 20px; }
    .close-modal {
      font-size: 24px;
      cursor: pointer;
      color: #a0aec0;
    }
    .modal-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: end;
    }
    .modal-form .form-group {
      display: flex;
      flex-direction: column;
    }
    .modal-form .form-group.full {
      grid-column: span 2;
    }
    .modal-form label {
      font-size: 12px;
      color: #cbd5e0;
      margin-bottom: 8px;
      text-align: left;
    }
    .modal-form input, .modal-form select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: #fff;
      outline: none;
      width: 100%;
      box-sizing: border-box;
    }
    .modal-footer {
      margin-top: 30px;
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      grid-column: span 2;
    }

    .btn-save {
      background: #2ecc71;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-cancel {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Gestión de Clientes</h1>
      <div class="nav-buttons">
        <button class="btn-nav" onclick="window.location.href='dashboard.html'">Dashboard</button>
        <button class="btn-nav" onclick="window.location.href='productos.html'">Productos</button>
        <button class="btn-nav" onclick="window.location.href='ventas.html'">Ventas</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchCustomer" placeholder="Buscar por nombre, teléfono o correo..." oninput="loadCustomers()">
      </div>
      <button class="btn-add" onclick="openCustomerModal()">+ Nuevo Cliente</button>
    </div>

    <div class="table-container">
      <table id="customersTable">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Crédito Disponible</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Cargado dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Cliente -->
  <div id="customerModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nuevo Cliente</h2>
        <span class="close-modal" onclick="closeCustomerModal()">&times;</span>
      </div>
      <form id="customerForm" class="modal-form">
        <input type="hidden" id="customerId">
        <div class="form-group full">
          <label>Nombre Completo</label>
          <input type="text" id="custName" required>
        </div>
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="custEmail">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" id="custPhone">
        </div>
        <div class="form-group full">
          <label>Dirección</label>
          <input type="text" id="custAddress">
        </div>
        <div class="form-group full">
          <label>Crédito Disponible ($)</label>
          <input type="number" step="0.01" id="custCredit" value="0.00">
        </div>
        <div class="modal-footer full">
          <button type="button" class="btn-cancel" onclick="closeCustomerModal()">Cancelar</button>
          <button type="submit" class="btn-save">Guardar Cliente</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // RBAC check
    const userStr = localStorage.getItem("currentUser");
    if (!userStr) {
      window.location.href = "index.html";
    } else {
      const user = JSON.parse(userStr);
      const userLevel = user.user_level || user.level;
      if (userLevel != 1 && userLevel != 2 && userLevel != 3) {
        alert("Acceso denegado.");
        window.location.href = "dashboard.html";
      }
    }

    async function loadCustomers() {
      const search = document.getElementById('searchCustomer').value;
      const response = await window.api.apiCall('customers', 'getAllCustomers', { search });
      
      if (response.success) {
        const customers = response.data;
        const tbody = document.querySelector('#customersTable tbody');
        tbody.innerHTML = '';

        customers.forEach(c => {
          const row = document.createElement('tr');
          
          const userStr = localStorage.getItem("currentUser");
          const user = userStr ? JSON.parse(userStr) : {};
          const userLevel = user.user_level || user.level;

          row.innerHTML = `
            <td>${c.name}</td>
            <td>${c.email || 'N/A'}</td>
            <td>${c.phone || 'N/A'}</td>
            <td>$${c.credit_limit || 0}</td>
            <td class="actions">
              <button class="btn-action btn-edit" onclick="editCustomer(${c.id})">Editar</button>
              ${userLevel == 1 || userLevel == 2 ? `<button class="btn-action btn-delete" onclick="deleteCustomer(${c.id})">Eliminar</button>` : ''}
            </td>
          `;
          tbody.appendChild(row);
        });
      }
    }

    function openCustomerModal(custId = null) {
      const userStr = localStorage.getItem("currentUser");
      const user = userStr ? JSON.parse(userStr) : {};
      const userLevel = user.user_level || user.level;

      if (userLevel != 1 && userLevel != 2 && userLevel != 3) {
        alert("No tienes permisos para añadir o editar clientes.");
        return;
      }

      const modal = document.getElementById('customerModal');
      const form = document.getElementById('customerForm');
      const title = document.getElementById('modalTitle');
      
      form.reset();
      document.getElementById('customerId').value = '';

      if (custId) {
        title.innerText = 'Editar Cliente';
        loadCustomerData(custId);
      } else {
        title.innerText = 'Nuevo Cliente';
      }
      
      modal.style.display = 'flex';
    }

    async function loadCustomerData(id) {
      const response = await window.api.apiCall('customers', 'getCustomerById', id);
      if (response.success && response.data) {
        const c = response.data;
        document.getElementById('customerId').value = c.id;
        document.getElementById('custName').value = c.name;
        document.getElementById('custEmail').value = c.email || '';
        document.getElementById('custPhone').value = c.phone || '';
        document.getElementById('custAddress').value = c.address || '';
        document.getElementById('custCredit').value = c.credit_limit || 0;
      }
    }

    function closeCustomerModal() {
      document.getElementById('customerModal').style.display = 'none';
    }

    document.getElementById('customerForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('customerId').value;
      const data = {
        name: document.getElementById('custName').value,
        email: document.getElementById('custEmail').value,
        phone: document.getElementById('custPhone').value,
        address: document.getElementById('custAddress').value,
        credit_limit: parseFloat(document.getElementById('custCredit').value)
      };

      const method = id ? 'updateCustomer' : 'addCustomer';
      const payload = id ? { id: parseInt(id), ...data } : data;

      const response = await window.api.apiCall('customers', method, payload);
      if (response.success) {
        alert(id ? "Cliente actualizado" : "Cliente creado");
        closeCustomerModal();
        loadCustomers();
      } else {
        alert("Error: " + response.message);
      }
    };

    async function deleteCustomer(id) {
      if (confirm("¿Estás seguro de eliminar este cliente?")) {
        const response = await window.api.apiCall('customers', 'deleteCustomer', id);
        if (response.success) {
          loadCustomers();
        } else {
          alert("Error: " + response.message);
        }
      }
    }

    // ✅ FIX: función editCustomer faltante
    function editCustomer(id) {
      openCustomerModal(id);
    }

    window.onload = loadCustomers;
  </script>
</body>
</html>
