<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Gestión de Proveedores - Inventario</title>
  <link rel="stylesheet" href="assets/styles.css?v=glass_1777557272110">
  <style>
    body {
      flex-direction: column;
      justify-content: flex-start;
      padding: 40px;
      overflow-y: auto;
      height: auto;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.8s ease-out;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
    }

    .header h1 {
      color: #00d2ff;
      font-size: 24px;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      outline: none;
    }

    .search-box input:focus {
      border-color: #00d2ff;
    }


    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #fff;
      font-size: 14px;
    }

    th {
      text-align: left;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      color: #00d2ff;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    }

    td {
      padding: 12px 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-history { background: #ecc94b; color: #1a202c; }
    .btn-history:hover { background: #d69e2e; }

    /* Historial Table */
    .history-table {
      width: 100%;
      margin-top: 10px;
      font-size: 12px;
      border-collapse: collapse;
    }
    .history-table th { font-size: 11px; padding: 8px; background: rgba(255,255,255,0.05); }
    .history-table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); color: #fff; }

    /* Modal wide for history */
    .modal-content.wide {
      width: 800px;
      max-width: 95%;
    }

    /* Modals */







    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #1a2a3a;
      padding: 30px;
      border-radius: 20px;
      width: 500px;
      max-width: 90%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: modalFadeIn 0.3s ease-out;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      color: #00d2ff;
      font-size: 20px;
    }

    .close-modal {
      font-size: 24px;
      cursor: pointer;
      color: #a0aec0;
    }

    .modal-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: end;
    }

    .modal-form .form-group {
      display: flex;
      flex-direction: column;
    }

    .modal-form .form-group.full {
      grid-column: span 2;
    }

    .modal-form label {
      font-size: 12px;
      color: #cbd5e0;
      margin-bottom: 8px;
      text-align: left;
    }

    .modal-form input,
    .modal-form select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      outline: none;
      width: 100%;
      box-sizing: border-box;
    }

    .modal-footer {
      margin-top: 30px;
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      grid-column: span 2;
    }




    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header">
      <h1>Gestión de Proveedores</h1>
      <div class="nav-buttons">
        <button class="btn-nav" onclick="window.location.href='dashboard.html'">Atrás</button>
        <button class="btn-nav" onclick="window.location.href='productos.html'">Productos</button>
        <button class="btn-nav" onclick="window.location.href='ventas.html'">Ventas</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchSupplier" placeholder="Buscar por nombre o contacto..." oninput="loadSuppliers()">
      </div>
      <button class="btn-add" onclick="openSupplierModal()">+ Nuevo Proveedor</button>
    </div>

    <div class="table-container">
      <table id="suppliersTable">
        <thead>
          <tr>
            <th>Nombre Empresa</th>
            <th>Contacto</th>
            <th>Deuda ($)</th>
            <th>Cedula</th>
            <th>Teléfono</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Cargado dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Proveedor -->
  <div id="supplierModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nuevo Proveedor</h2>
        <span class="close-modal" onclick="closeSupplierModal()">&times;</span>
      </div>
      <form id="supplierForm" class="modal-form">
        <input type="hidden" id="supplierId">
        <div class="form-group full">
          <label>Nombre de la Empresa</label>
          <input type="text" id="suppName" required>
        </div>
        <div class="form-group">
          <label>Persona de Contacto</label>
          <input type="text" id="suppContact">
        </div>
        <div class="form-group">
          <label>Cedula</label>
          <input type="text" id="suppCedula">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" id="suppPhone">
        </div>
        <div class="form-group full">
          <label>Dirección</label>
          <input type="text" id="suppAddress">
        </div>
        <div class="modal-footer full">
          <button type="button" class="btn-cancel" onclick="closeSupplierModal()">Cancelar</button>
          <button type="submit" class="btn-save">Guardar Proveedor</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Pago / Abono -->
  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="paymentTitle">Registrar Pago a Proveedor</h2>
        <span class="close-modal" onclick="closePaymentModal()">&times;</span>
      </div>
      <form id="paymentForm" class="modal-form">
        <input type="hidden" id="paySuppId">
        <input type="hidden" id="payPurchaseId">
        <div class="form-group full">
          <label>Proveedor</label>
          <input type="text" id="paySuppName" readonly>
        </div>
        <div class="form-group">
          <label>Deuda Pendiente ($)</label>
          <input type="text" id="payCurrentDebt" readonly>
        </div>
        <div class="form-group">
          <label>Monto a Pagar ($)</label>
          <input type="number" id="payAmount" step="0.01" required>
        </div>
        <div class="form-group full">
          <label>Nota / Referencia</label>
          <input type="text" id="payNote" placeholder="Ej: Pago factura #123">
        </div>
        <div class="modal-footer full">
          <button type="button" class="btn-cancel" onclick="closePaymentModal()">Cancelar</button>
          <button type="submit" class="btn-save">Confirmar Pago</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Historial -->
  <div id="historyModal" class="modal">
    <div class="modal-content wide">
      <div class="modal-header">
        <h2 id="historyTitle">Historial de Compras</h2>
        <span class="close-modal" onclick="closeHistoryModal()">&times;</span>
      </div>

      <div class="history-tabs" style="display:flex; gap:10px; margin-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">
        <button id="tabPurchasesBtn" class="tab-btn active" onclick="switchHistoryTab('purchases')">Compras Pendientes</button>
        <button id="tabPaymentsBtn" class="tab-btn" onclick="switchHistoryTab('payments')">Historial de Pagos</button>
      </div>
      
      <div id="historyPurchases" class="tab-content">
        <div class="table-container" style="max-height: 400px;">
          <table class="history-table">
            <thead>
              <tr>
                <th>ID Compra</th>
                <th>Fecha</th>
                <th>Productos</th>
                <th>Total ($)</th>
                <th>Saldo ($)</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="historyPurchasesBody"></tbody>
          </table>
        </div>
      </div>

      <div id="historyPayments" class="tab-content" style="display:none;">
        <div class="table-container" style="max-height: 400px;">
          <table class="history-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Monto ($)</th>
                <th>Nota</th>
              </tr>
            </thead>
            <tbody id="historyPaymentsBody"></tbody>
          </table>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" onclick="closeHistoryModal()">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    // RBAC check
    const userStr = localStorage.getItem("currentUser");
    if (!userStr) {
      window.location.href = "index.html";
    } else {
      const user = JSON.parse(userStr);
      const userLevel = user.user_level || user.level;
      if (userLevel != 1 && userLevel != 2) {
        alert("Acceso denegado: No tienes permisos para gestionar proveedores.");
        window.location.href = "dashboard.html";
      }
    }

    async function loadSuppliers() {
      const search = document.getElementById('searchSupplier').value;
      const response = await window.api.apiCall('suppliers', 'getAllSuppliers', { search });

      if (response.success) {
        const suppliers = response.data;
        const tbody = document.querySelector('#suppliersTable tbody');
        tbody.innerHTML = '';

        suppliers.forEach(s => {
          const row = document.createElement('tr');

          const userStr = localStorage.getItem("currentUser");
          const user = userStr ? JSON.parse(userStr) : {};
          const userLevel = user.user_level || user.level;

          row.innerHTML = `
            <td>${s.name}</td>
            <td>${s.contact_name || 'N/A'}</td>
            <td style="color: ${parseFloat(s.debt) > 0 ? '#f6ad55' : '#48bb78'}">$${parseFloat(s.debt || 0).toFixed(2)}</td>
            <td>${s.cedula || 'N/A'}</td>
            <td>${s.phone || 'N/A'}</td>
            <td class="actions">
              <button class="btn-action btn-history" onclick="openHistory(${s.id}, '${s.name}')">Historial</button>
              <button class="btn-action btn-edit" onclick="editSupplier(${s.id})">Editar</button>
              ${userLevel == 1 ? '<button class="btn-action btn-delete" onclick="deleteSupplier(' + s.id + ')">Eliminar</button>' : ''}
            </td>
          `;
          tbody.appendChild(row);
        });
      }
    }

    function openSupplierModal(suppId = null) {
      const userStr = localStorage.getItem("currentUser");
      const user = userStr ? JSON.parse(userStr) : {};
      const userLevel = user.user_level || user.level;

      if (userLevel != 1 && userLevel != 2) {
        alert("No tienes permisos para añadir o editar proveedores.");
        return;
      }

      const modal = document.getElementById('supplierModal');
      const form = document.getElementById('supplierForm');
      const title = document.getElementById('modalTitle');

      form.reset();
      document.getElementById('supplierId').value = '';

      if (suppId) {
        title.innerText = 'Editar Proveedor';
        loadSupplierData(suppId);
      } else {
        title.innerText = 'Nuevo Proveedor';
      }

      modal.style.display = 'flex';
    }

    async function loadSupplierData(id) {
      const response = await window.api.apiCall('suppliers', 'getSupplierById', id);
      if (response.success && response.data) {
        const s = response.data;
        document.getElementById('supplierId').value = s.id;
        document.getElementById('suppName').value = s.name;
        document.getElementById('suppContact').value = s.contact_name || '';
        document.getElementById('suppCedula').value = s.cedula || '';
        document.getElementById('suppPhone').value = s.phone || '';
        document.getElementById('suppAddress').value = s.address || '';
      }
    }

    function closeSupplierModal() {
      document.getElementById('supplierModal').style.display = 'none';
      document.getElementById('supplierForm').reset();
    }

    document.getElementById('supplierForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('supplierId').value;
      const data = {
        name: document.getElementById('suppName').value,
        contact_name: document.getElementById('suppContact').value,
        cedula: document.getElementById('suppCedula').value,
        phone: document.getElementById('suppPhone').value,
        address: document.getElementById('suppAddress').value
      };

      const method = id ? 'updateSupplier' : 'addSupplier';
      const payload = id ? { id: parseInt(id), ...data } : data;

      const response = await window.api.apiCall('suppliers', method, payload);
      if (response.success) {
        alert(id ? "Proveedor actualizado" : "Proveedor creado");
        closeSupplierModal();
        loadSuppliers();
      } else {
        alert("Error: " + response.message);
      }
    };

    async function deleteSupplier(id) {
      if (confirm("¿Estás seguro de eliminar este proveedor?")) {
        const response = await window.api.apiCall('suppliers', 'deleteSupplier', id);
        if (response.success) {
          loadSuppliers();
        } else {
          alert("Error: " + response.message);
        }
      }
    }

    // ✅ FIX: función editSupplier faltante
    function editSupplier(id) {
      openSupplierModal(id);
    }

    // ✅ GESTIÓN DE HISTORIAL
    async function openHistory(id, name) {
      document.getElementById('historyTitle').innerText = `Historial: ${name}`;
      const response = await window.api.apiCall('suppliers', 'getPurchaseHistory', id);
      
      if (response.success) {
        const historyBody = document.getElementById('historyBody');
        historyBody.innerHTML = '';
        
        if (!response.data || response.data.length === 0) {
          historyBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No hay compras registradas para este proveedor.</td></tr>';
        } else {
          response.data.forEach(p => {
            const row = `
              <tr>
                <td>#${p.id}</td>
                <td>${new Date(p.date).toLocaleString()}</td>
                <td>${p.products}</td>
                <td style="color: #00d2ff; font-weight: bold;">$${parseFloat(p.total).toFixed(2)}</td>
              </tr>
            `;
            historyBody.innerHTML += row;
          });
        }
        document.getElementById('historyModal').style.display = 'flex';
      } else {
        alert("Error al cargar historial: " + response.error);
      }
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').style.display = 'none';
    }

    // ✅ GESTIÓN DE PAGOS Y ABONOS
    function openPayment(id, name, debt, purchaseId = null) {
      document.getElementById('paySuppId').value = id;
      document.getElementById('payPurchaseId').value = purchaseId || '';
      document.getElementById('paySuppName').value = name + (purchaseId ? ` (Compra #${purchaseId})` : '');
      document.getElementById('payCurrentDebt').value = `$${parseFloat(debt).toFixed(2)}`;
      document.getElementById('payAmount').value = '';
      document.getElementById('payAmount').max = debt;
      document.getElementById('paymentModal').style.display = 'flex';
    }

    function closePaymentModal() {
      document.getElementById('paymentModal').style.display = 'none';
    }

    document.getElementById('paymentForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('paySuppId').value;
      const purchaseId = document.getElementById('payPurchaseId').value;
      const amount = parseFloat(document.getElementById('payAmount').value);
      const note = document.getElementById('payNote').value;

      const response = await window.api.apiCall('suppliers', 'addPayment', parseInt(id), amount, note, purchaseId ? parseInt(purchaseId) : null);
      if (response.success) {
        alert("Pago registrado con éxito");
        closePaymentModal();
        loadSuppliers();
        if (document.getElementById('historyModal').style.display === 'flex') {
           // Recargar historial si está abierto
           openHistory(parseInt(id), document.getElementById('paySuppName').value.split(' (')[0]);
        }
      } else {
        alert("Error: " + (response.error || response.message));
      }
    };

    // ✅ GESTIÓN DE HISTORIAL
    async function openHistory(id, name) {
      document.getElementById('historyTitle').innerText = `Historial: ${name}`;
      const response = await window.api.apiCall('suppliers', 'getPurchaseHistory', id);
      
      if (response.success) {
        renderHistoryPurchases(response.sales, name);
        renderHistoryPayments(response.payments);
        switchHistoryTab('purchases');
        document.getElementById('historyModal').style.display = 'flex';
      } else {
        alert("Error al cargar historial: " + response.error);
      }
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').style.display = 'none';
    }

    function switchHistoryTab(tab) {
      document.getElementById('historyPurchases').style.display = tab === 'purchases' ? 'block' : 'none';
      document.getElementById('historyPayments').style.display = tab === 'payments' ? 'block' : 'none';
      
      document.getElementById('tabPurchasesBtn').classList.toggle('active', tab === 'purchases');
      document.getElementById('tabPaymentsBtn').classList.toggle('active', tab === 'payments');
    }

    function renderHistoryPurchases(purchases, supplierName) {
      const tbody = document.getElementById('historyPurchasesBody');
      tbody.innerHTML = '';
      if (!purchases || purchases.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No hay compras registradas.</td></tr>';
        return;
      }
      purchases.forEach(p => {
        const row = `<tr>
          <td>#${p.id}</td>
          <td>${new Date(p.date).toLocaleString()}</td>
          <td>${p.products}</td>
          <td>$${parseFloat(p.total).toFixed(2)}</td>
          <td style="color: #f6ad55; font-weight: bold;">$${parseFloat(p.pending_amount || 0).toFixed(2)}</td>
          <td>
            ${parseFloat(p.pending_amount) > 0 ? `<button class="btn-action btn-pay" onclick="openPayment(${p.supplier_id || 'null'}, '${supplierName}', ${p.pending_amount}, ${p.id})">Abonar</button>` : '<span class="status-badge status-paid">Pagado</span>'}
          </td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    function renderHistoryPayments(payments) {
      const tbody = document.getElementById('historyPaymentsBody');
      tbody.innerHTML = '';
      if (!payments || payments.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No se han registrado pagos.</td></tr>';
        return;
      }
      payments.forEach(p => {
        const row = `<tr>
          <td>${new Date(p.date).toLocaleString()}</td>
          <td style="color: #48bb78; font-weight: bold;">$${parseFloat(p.amount).toFixed(2)}</td>
          <td>${p.note || '---'}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    // ✅ FIX: Escape y click en backdrop para cerrar modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeSupplierModal();
        closeHistoryModal();
        closePaymentModal();
      }
    });

    document.querySelectorAll('.modal').forEach(m => {
      m.addEventListener('click', (e) => {
        if (e.target === m) {
          closeSupplierModal();
          closeHistoryModal();
          closePaymentModal();
        }
      });
    });

    window.onload = loadSuppliers;
  </script>
</body>

</html>

</content>
