<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>POS - Punto de Venta Professional</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    body {
      display: flex;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    .pos-container {
      display: grid;
      grid-template-columns: 1fr 400px;
      width: 100%;
      gap: 0;
    }
    /* Sección Izquierda: Catálogo y Búsqueda */
    .pos-main {
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.02);
    }
    .pos-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .pos-header h1 { color: #00d2ff; font-size: 24px; }
    .pos-nav { display: flex; gap: 10px; }

    .search-section {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }
    .search-bar {
      flex: 1;
      padding: 15px 20px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 18px;
      outline: none;
      transition: border-color 0.3s;
    }
    .search-bar:focus { border-color: #00d2ff; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-5px);
      background: rgba(255,255,255,0.1);
      border-color: #00d2ff;
    }
    .product-card .no-stock {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .product-card h3 { font-size: 14px; margin-bottom: 5px; }
    .product-card .price { color: #00d2ff; font-weight: bold; font-size: 16px; }
    .product-card .stock-info { font-size: 11px; color: #a0aec0; margin-top: 5px; }
    .stock-low { color: #e74c3c !important; }

    /* Sección Derecha: Carrito */
    .pos-sidebar {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .cart-title {
      font-size: 20px;
      color: #fff;
      margin-bottom: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }
    .cart-items {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 20px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .cart-item-info h4 { font-size: 13px; margin: 0; }
    .cart-item-info p { font-size: 11px; color: #a0aec0; margin: 0; }
    .cart-item-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: none;
      width: 25px;
      height: 25px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .qty-btn:hover { background: #00d2ff; color: #000; }

    .checkout-section {
      border-top: 2px solid rgba(255,255,255,0.1);
      padding-top: 20px;
    }
    .checkout-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #00d2ff;
    }
    .checkout-form { display: flex; flex-direction: column; gap: 10px; }
    .checkout-form select, .checkout-form input {
      padding: 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      outline: none;
    }
    .btn-pay {
      background: linear-gradient(90deg, #2ecc71 0%, #27ae60 100%);
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    .btn-pay:hover {
      transform: scale(1.02);
      box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
    }
    .btn-nav {-radius: 0; margin-left: -1px;}
    
    
    .btn-nav:hover { background: #00d2ff; color: #000; }
    .empty-cart {
      text-align: center;
      color: #a0aec0;
      margin-top: 50px;
      font-size: 14px;
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #1a2a3a;
      padding: 20px;
      border-radius: 12px;
      width: 400px;
      max-width: 90%;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      color: #fff;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .modal-header h2 { color: #00d2ff; font-size: 18px; margin: 0; }
    .close-modal {
      font-size: 24px;
      cursor: pointer;
      color: #a0aec0;
      line-height: 1;
    }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; color: #a0aec0; margin-bottom: 5px; }
    .form-group input { 
      width: 100%; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); 
      border: 1px solid rgba(255,255,255,0.2); color: #fff; box-sizing: border-box; outline: none;
    }
    .btn-save {
      background: #2ecc71; color: #fff; border: none; padding: 10px 20px;
      border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%;
    }
  </style>
</head>
<body>

  <div class="pos-container">
    <div class="pos-main">
      <div class="pos-header">
        <h1>🛒 Punto de Venta</h1>
        <div class="pos-nav">
          <button class="btn-nav" onclick="window.location.href='dashboard.html'">Dashboard</button>
          <button class="btn-nav" onclick="window.location.href='sales_history.html'">Historial</button>
        </div>
      </div>

      <div class="search-section">
        <input type="text" id="productSearch" class="search-bar"
               placeholder="Buscar producto por nombre, SKU o código de barras..."
               oninput="searchProducts()">
      </div>

      <div class="product-grid" id="productGrid">
        <div class="empty-cart">Cargando productos...</div>
      </div>
    </div>

    <div class="pos-sidebar">
      <div class="cart-title">🧾 Carrito de Ventas</div>

      <div class="cart-items" id="cartItems">
        <div class="empty-cart">El carrito está vacío</div>
      </div>

      <div class="checkout-section">
        <div class="checkout-form">
          <label style="font-size: 12px; color: #a0aec0;">Cliente</label>
          <div style="display: flex; gap: 5px;">
            <input type="text" id="customerSearchInput" list="customerList" placeholder="Buscar o seleccionar cliente..." oninput="handleCustomerSelect()" style="flex: 1; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff; outline: none;">
            <datalist id="customerList"></datalist>
            <input type="hidden" id="customerSelect" value="">
            <button onclick="openCustomerModal()" style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer; padding: 0 10px;">+ Nuevo</button>
          </div>
          <div id="customerCreditDisplay" style="font-size: 13px; color: #00d2ff; margin-top: -5px; font-weight: bold; display: none;">Crédito Disponible: $0.00</div>

          <label style="font-size: 12px; color: #a0aec0;">Método de Pago</label>
          <select id="paymentMethod">
            <option value="Efectivo">Efectivo</option>
            <option value="Tarjeta">Tarjeta</option>
            <option value="Transferencia">Transferencia</option>
            <option value="Crédito">Crédito</option>
          </select>
        </div>

        <div class="checkout-row" style="margin-top: 20px;">
          <span>Subtotal:</span>
          <span id="subtotal" style="text-align: right;">$0.00 <br><span style="font-size:14px; color:#a0aec0;">Bs 0.00</span></span>
        </div>
        <div class="total-row">
          <span>Total:</span>
          <span id="totalAmount" style="text-align: right;">$0.00 <br><span style="font-size:16px; color:#a0aec0;">Bs 0.00</span></span>
        </div>

        <button class="btn-pay" id="btnPay" onclick="processSale()">✔ Completar Venta</button>
      </div>
    </div>
  </div>

  <!-- Modal Peso -->
  <div id="weightModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Peso del Producto</h2>
        <span class="close-modal" onclick="closeWeightModal()">&times;</span>
      </div>
      <div class="form-group">
        <label>Ingrese el peso en Gramos o Kilos (Ej. 0.500 para medio kilo, 1.250 para 1 kilo y cuarto)</label>
        <input type="number" step="0.001" id="weightInput" placeholder="Ej: 0.500">
      </div>
      <button class="btn-save" onclick="confirmWeight()">Confirmar Peso</button>
    </div>
  </div>

  <!-- Modal Cliente -->
  <div id="customerModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Nuevo Cliente</h2>
        <span class="close-modal" onclick="closeCustomerModal()">&times;</span>
      </div>
      <form id="customerForm" onsubmit="saveNewCustomer(event)">
        <div class="form-group">
          <label>Nombre *</label>
          <input type="text" id="custName" required>
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" id="custPhone">
        </div>
        <div class="form-group">
          <label>Crédito Disponible ($)</label>
          <input type="number" step="0.01" id="custCredit" value="0.00">
        </div>
        <button type="submit" class="btn-save">Guardar Cliente</button>
      </form>
    </div>
  </div>

  <script>
    let cart = [];
    let currentBcvRate = 1.00;
    let pendingWeighableProduct = null;
    const currentUser = JSON.parse(localStorage.getItem("currentUser"));

    if (!currentUser) {
      window.location.href = 'index.html';
    }

    // ✅ FIX: Cargar TODOS los productos al iniciar el POS
    async function loadAllProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '<div class="empty-cart">Cargando productos...</div>';
      const response = await window.api.apiCall('products', 'getAllProducts', {});
      if (response.success) {
        renderProducts(response.data);
      } else {
        grid.innerHTML = '<div class="empty-cart">Error al cargar productos.</div>';
      }
    }

    // ✅ FIX: Búsqueda con Debounce para evitar race conditions e IPC flooding
    let searchTimeout;
    async function searchProducts() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(async () => {
        const query = document.getElementById('productSearch').value;
        const response = await window.api.apiCall('products', 'getAllProducts', { search: query });
        if (response.success) {
          renderProducts(response.data);
        }
      }, 300);
    }


    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      if (!products || products.length === 0) {
        grid.innerHTML = '<div class="empty-cart">No se encontraron productos.</div>';
        return;
      }

      products.forEach(p => {
        const card = document.createElement('div');
        const hasStock = p.quantity > 0;
        card.className = 'product-card' + (hasStock ? '' : ' no-stock');
        if (hasStock) card.onclick = () => addToCart(p);
        const stockClass = p.quantity <= p.min_stock ? 'stock-low' : '';
        card.innerHTML = `
          <h3>${p.name}</h3>
          <div class="price">$${parseFloat(p.sale_price).toFixed(2)} <br><span style="font-size: 12px; color: #a0aec0;">Bs ${(parseFloat(p.sale_price) * currentBcvRate).toFixed(2)}</span></div>
          <div class="stock-info ${stockClass}">
            ${hasStock ? `Stock: ${parseFloat(p.quantity)}` : '⚠ Sin stock'} ${p.is_weighable ? '(Pesable)' : ''}
          </div>
          ${p.sku ? `<div class="stock-info">SKU: ${p.sku}</div>` : ''}
        `;
        grid.appendChild(card);
      });
    }

    function addToCart(product, forcedQuantity = null) {
      if (product.is_weighable && forcedQuantity === null) {
        pendingWeighableProduct = product;
        document.getElementById('weightModal').style.display = 'flex';
        document.getElementById('weightInput').value = '';
        setTimeout(() => document.getElementById('weightInput').focus(), 100);
        return;
      }

      const qtyToAdd = parseFloat(forcedQuantity !== null ? forcedQuantity : 1);
      const productMaxStock = parseFloat(product.quantity);
      const existing = cart.find(item => item.id === product.id);
      
      if (existing) {
        if ((existing.quantity + qtyToAdd) <= productMaxStock) {
          existing.quantity += qtyToAdd;
          existing.total = existing.quantity * existing.price;
        } else {
          alert("No hay más stock disponible para este producto.");
          return;
        }
      } else {
        if (qtyToAdd > productMaxStock) {
          alert("Stock insuficiente.");
          return;
        }
        cart.push({
          id: product.id,
          name: product.name,
          price: parseFloat(product.sale_price),
          quantity: qtyToAdd,
          maxStock: productMaxStock,
          total: parseFloat(product.sale_price) * qtyToAdd,
          isWeighable: product.is_weighable
        });
      }
      renderCart();
    }

    function closeWeightModal() {
      document.getElementById('weightModal').style.display = 'none';
      pendingWeighableProduct = null;
    }

    function confirmWeight() {
      const w = parseFloat(document.getElementById('weightInput').value);
      if (!w || w <= 0) {
        alert("Por favor ingrese un peso válido.");
        return;
      }
      if (pendingWeighableProduct) {
        addToCart(pendingWeighableProduct, w);
        closeWeightModal();
      }
    }

    function updateQty(id, delta) {
      const idx = cart.findIndex(i => i.id === id);
      if (idx === -1) return;
      
      let newQty = cart[idx].quantity;
      if (cart[idx].isWeighable) {
        newQty += (delta > 0 ? 0.1 : -0.1);
        newQty = parseFloat(newQty.toFixed(3));
      } else {
        newQty += delta;
      }
      
      // ✅ VALIDACIÓN DE STOCK REAL AL INCREMENTAR DESDE EL CARRITO
      if (newQty > cart[idx].maxStock) {
        alert("No hay más stock disponible para este producto.");
        return;
      }

      cart[idx].quantity = newQty;
      
      if (cart[idx].quantity <= 0) {
        cart.splice(idx, 1);
      } else {
        cart[idx].total = cart[idx].quantity * cart[idx].price;
      }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cartItems');
      container.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = '<div class="empty-cart">El carrito está vacío</div>';
        document.getElementById('subtotal').innerHTML = `$0.00 <br><span style="font-size:14px; color:#a0aec0;">Bs 0.00</span>`;
        document.getElementById('totalAmount').innerHTML = `$0.00 <br><span style="font-size:16px; color:#a0aec0;">Bs 0.00</span>`;
        return;
      }

      cart.forEach(item => {
        total += item.total;
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <div class="cart-item-info">
            <h4>${item.name}</h4>
            <p>$${item.price.toFixed(2)} × ${item.quantity}</p>
          </div>
          <div class="cart-item-controls">
            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">−</button>
            <span style="font-size:12px;">${parseFloat(item.quantity).toFixed(3).replace(/\.?0+$/, '')}</span>
            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
            <span style="font-weight: bold; min-width: 60px; text-align: right;">$${item.total.toFixed(2)}</span>
          </div>
        `;
        container.appendChild(div);
      });

      document.getElementById('subtotal').innerHTML = `$${total.toFixed(2)} <br><span style="font-size:14px; color:#a0aec0;">Bs ${(total * currentBcvRate).toFixed(2)}</span>`;
      document.getElementById('totalAmount').innerHTML = `$${total.toFixed(2)} <br><span style="font-size:16px; color:#a0aec0;">Bs ${(total * currentBcvRate).toFixed(2)}</span>`;
    }

    let customersData = [];
    async function loadCustomers() {
      const response = await window.api.apiCall('customers', 'getAllCustomers');
      if (response && response.success) {
        customersData = response.data;
        const datalist = document.getElementById('customerList');
        datalist.innerHTML = '';
        customersData.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.name;
          datalist.appendChild(opt);
        });
      }
    }

    function handleCustomerSelect() {
      const inputName = document.getElementById('customerSearchInput').value;
      const customer = customersData.find(c => c.name === inputName);
      document.getElementById('customerSelect').value = customer ? customer.id : '';
      
      const creditDisplay = document.getElementById('customerCreditDisplay');
      if (customer) {
        creditDisplay.style.display = 'block';
        creditDisplay.innerText = `Crédito Disponible: $${(parseFloat(customer.credit_limit) || 0).toFixed(2)}`;
      } else {
        creditDisplay.style.display = 'none';
      }
    }

    async function processSale() {
      if (cart.length === 0) {
        alert("El carrito está vacío. Agregue productos antes de procesar la venta.");
        return;
      }

      const btn = document.getElementById('btnPay');
      btn.disabled = true;
      btn.innerText = 'Procesando...';

      const totalText = document.getElementById('totalAmount').innerText.split('$')[1].split('<')[0].trim();
      const saleData = {
        customerId: document.getElementById('customerSelect').value || null,
        userId: currentUser ? currentUser.id : null,
        paymentMethod: document.getElementById('paymentMethod').value,
        items: cart,
        total: parseFloat(totalText)
      };

      try {
        const response = await window.api.apiCall('sales', 'addSale', saleData);
        if (response.success) {
          alert(`✅ Venta #${response.saleId} completada con éxito.\nTotal: $${saleData.total.toFixed(2)}`);
          
          // Abrir recibo
          const customerName = document.getElementById('customerSearchInput').value || 'Consumidor Final';
          if (window.api.openReceipt) {
            window.api.openReceipt({
              saleId: response.saleId,
              customerName: customerName,
              items: cart,
              total: saleData.total,
              bcvRate: currentBcvRate,
              paymentMethod: saleData.paymentMethod
            });
          }

          cart = [];
          renderCart();
          await loadAllProducts(); // Recargar stock actualizado
          await loadCustomers(); // Actualizar el crédito de clientes
          handleCustomerSelect(); // Refrescar en UI el crédito disponible actual
        } else {
          alert("Error al procesar venta: " + response.msg);
        }
      } catch (err) {
        alert("Error inesperado: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '✔ Completar Venta';
      }
    }

    function openCustomerModal() {
      document.getElementById('customerModal').style.display = 'flex';
    }

    function closeCustomerModal() {
      document.getElementById('customerModal').style.display = 'none';
      document.getElementById('customerForm').reset();
    }

    async function saveNewCustomer(e) {
      e.preventDefault();
      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const credit = parseFloat(document.getElementById('custCredit').value) || 0;

      const response = await window.api.apiCall('customers', 'addCustomer', { name, phone, credit_limit: credit });
      if (response.success) {
        alert("Cliente guardado correctamente.");
        await loadCustomers();
        const newCust = response.data?.id;
        if (newCust) {
          document.getElementById('customerSelect').value = newCust;
          document.getElementById('customerSearchInput').value = name;
          handleCustomerSelect(); // Mostrar el crédito disponible recién ingresado
        }
        closeCustomerModal();
      } else {
        alert("Error al guardar cliente: " + response.msg);
      }
    }

    // Escáner de Código de Barras Global
    let barcodeString = '';
    let barcodeTimeout = null;

    document.addEventListener('keydown', async (e) => {
      // Ignorar si estamos escribiendo en un input
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (document.getElementById('weightModal').style.display === 'flex') return;

      if (e.key === 'Enter') {
        if (barcodeString.length > 2) {
          // Procesar código
          const response = await window.api.apiCall('products', 'getAllProducts', { search: barcodeString });
          if (response.success && response.data.length > 0) {
            // Asumimos que el primero es el match exacto del barcode o sku
            const p = response.data.find(prod => prod.barcode === barcodeString || prod.sku === barcodeString) || response.data[0];
            addToCart(p);
          } else {
            console.log("Producto no encontrado por escáner:", barcodeString);
          }
        }
        barcodeString = '';
      } else if (e.key.length === 1) {
        barcodeString += e.key;
        clearTimeout(barcodeTimeout);
        barcodeTimeout = setTimeout(() => { barcodeString = ''; }, 100); // 100ms debounce
      }
    });

    window.onload = async () => {
      const bcvRes = await window.api.apiCall('settings', 'getSetting', 'bcv_rate');
      if (bcvRes && bcvRes.success && bcvRes.data) {
        currentBcvRate = parseFloat(bcvRes.data);
        // Forzar renderizado inicial para mostrar la tasa en estado vacío
        document.getElementById('subtotal').innerHTML = `$0.00 <br><span style="font-size:14px; color:#a0aec0;">Bs 0.00</span>`;
        document.getElementById('totalAmount').innerHTML = `$0.00 <br><span style="font-size:16px; color:#a0aec0;">Bs 0.00</span>`;
      }

      await loadCustomers();
      await loadAllProducts(); // ✅ Carga inmediata del catálogo
    };
  </script>
</body>
</html>
