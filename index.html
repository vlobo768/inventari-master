<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistema de Inventario</title>
  <meta name="description" content="Inicio de sesión del sistema ERP/POS de inventario profesional.">
  <link rel="stylesheet" href="assets/styles.css">
</head>

<body>

  <div class="login-page-wrapper">
    <div class="login-page">

      <div class="text-center">
        <h1>🏪 Inventario Pro</h1>
        <p>Sistema de Gestión ERP/POS</p>
      </div>

      <div id="msg"></div>

      <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username" type="text" placeholder="Ingrese su usuario" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Ingrese su contraseña" autocomplete="current-password">
      </div>

      <div class="form-group">
        <button class="btn" id="btnLogin" onclick="login()">Entrar al Sistema</button>
      </div>

    </div>
  </div>

  <script src="login.js"></script>

</body>

</html>
