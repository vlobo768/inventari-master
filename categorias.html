<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Gestión de Categorías - Inventario</title>
  <link rel="stylesheet" href="assets/styles.css?v=glass_1777557272106">
  <style>
    body {
      flex-direction: column;
      justify-content: flex-start;
      padding: 40px;
      overflow-y: auto;
      height: auto;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.8s ease-out;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
    }

    .header h1 {
      color: #00d2ff;
      font-size: 24px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #1a2a3a;
      padding: 30px;
      border-radius: 20px;
      width: 400px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: modalFadeIn 0.3s ease-out;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      color: #00d2ff;
      font-size: 20px;
    }

    .close-modal {
      font-size: 24px;
      cursor: pointer;
      color: #a0aec0;
    }

    .modal-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: end;
    }

    .modal-form .form-group {
      display: flex;
      flex-direction: column;
    }

    .modal-form label {
      font-size: 12px;
      color: #cbd5e0;
      margin-bottom: 8px;
      text-align: left;
    }

    .modal-form input,
    .modal-form select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      outline: none;
      width: 100%;
      box-sizing: border-box;
    }

    .modal-footer {
      margin-top: 30px;
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      grid-column: span 2;
    }





    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Selection Mode Styles */
    .selection-mode .col-check {
      display: table-cell !important;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #00d2ff;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header">
      <h1>Gestión de Categorías</h1>
      <div class="nav-buttons">
        <button id="btnToggleSelection" class="btn-nav"
          style="background: linear-gradient(90deg, #34495e 0%, #2c3e50 100%);"
          onclick="toggleSelectionMode()">Seleccionar</button>
        <button class="btn-nav" onclick="window.location.href='dashboard.html'">Atrás</button>
        <button class="btn-nav" onclick="window.location.href='productos.html'">Productos</button>
        <button class="btn-nav" onclick="window.location.href='users.html'">Usuarios</button>
        <button class="btn-nav" onclick="window.location.href='ventas.html'">Ventas</button>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn-add" onclick="openCategoryModal()">+ Nueva Categoría</button>
    </div>

    <!-- Barra de Acciones en Masa -->
    <div id="bulkBar"
      style="display: none; background: rgba(0, 210, 255, 0.1); border: 1px solid rgba(0, 210, 255, 0.3); padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; justify-content: space-between; align-items: center; animation: fadeIn 0.3s ease-out;">
      <div style="font-weight: 600; color: #fff;">
        <span id="selectedCount">0</span> categorías seleccionadas
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn-action btn-delete" style="padding: 10px 20px; font-size: 14px;"
          onclick="bulkDeleteCategories()">Eliminar Seleccionadas</button>
      </div>
    </div>

    <div class="table-container">
      <table id="catTable">
        <thead>
          <tr>
            <th class="col-check" style="display: none; width: 40px; text-align: center;"><input type="checkbox"
                id="selectAll" onclick="toggleSelectAll(this)"></th>
            <th>Nombre</th>
            <th>Categoría Padre</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Cargado dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Categoría -->
  <div id="catModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nueva Categoría</h2>
        <span class="close-modal" onclick="closeCategoryModal()">&times;</span>
      </div>
      <form id="catForm" class="modal-form">
        <input type="hidden" id="catId">
        <div class="form-group">
          <label>Nombre de la Categoría</label>
          <input type="text" id="catName" required>
        </div>
        <div class="form-group">
          <label>Categoría Padre (Opcional)</label>
          <select id="catParent">
            <option value="">Ninguna (Categoría Raíz)</option>
            <!-- Cargado dinámicamente -->
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancel" onclick="closeCategoryModal()">Cancelar</button>
          <button type="submit" class="btn-save">Guardar Categoría</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // --- SELECTION MODE LOGIC ---
    let selectionMode = false;
    let selectedCategories = new Set();

    function toggleSelectionMode() {
      selectionMode = !selectionMode;
      const container = document.querySelector('.container');
      const btn = document.getElementById('btnToggleSelection');
      const bulkBar = document.getElementById('bulkBar');
      const colChecks = document.querySelectorAll('.col-check');

      if (selectionMode) {
        container.classList.add('selection-mode');
        btn.innerText = 'Cancelar Selección';
        btn.style.background = 'linear-gradient(90deg, #e74c3c 0%, #c0392b 100%)';
        bulkBar.style.display = 'flex';
      } else {
        container.classList.remove('selection-mode');
        btn.innerText = 'Seleccionar';
        btn.style.background = 'linear-gradient(90deg, #34495e 0%, #2c3e50 100%)';
        bulkBar.style.display = 'none';
        selectedCategories.clear();
        updateSelectedCount();
        document.getElementById('selectAll').checked = false;
      }
      loadCategories();
    }

    function toggleSelectAll(master) {
      const checkboxes = document.querySelectorAll('.cat-check');
      checkboxes.forEach(cb => {
        cb.checked = master.checked;
        const id = parseInt(cb.getAttribute('data-id'));
        if (master.checked) selectedCategories.add(id);
        else selectedCategories.delete(id);
      });
      updateSelectedCount();
    }

    function handleRowCheck(cb, id) {
      if (cb.checked) selectedCategories.add(id);
      else {
        selectedCategories.delete(id);
        document.getElementById('selectAll').checked = false;
      }
      updateSelectedCount();
    }

    function updateSelectedCount() {
      document.getElementById('selectedCount').innerText = selectedCategories.size;
    }

    async function bulkDeleteCategories() {
      if (selectedCategories.size === 0) return;

      if (confirm(`¿Estás seguro de eliminar las ${selectedCategories.size} categorías seleccionadas? Si tienen productos asociados, la eliminación de esas categorías fallará.`)) {
        const ids = Array.from(selectedCategories);
        let successCount = 0;
        let failCount = 0;

        for (const id of ids) {
          try {
            const response = await window.api.apiCall('categories', 'deleteCategory', id);
            if (response.success) successCount++;
            else failCount++;
          } catch (e) { failCount++; }
        }

        alert(`Proceso completado.\nÉxito: ${successCount}\nFallidos (pueden tener productos): ${failCount}`);
        selectedCategories.clear();
        updateSelectedCount();
        if (selectionMode) toggleSelectionMode();
        else loadCategories();
      }
    }

    // RBAC check
    const userStr = localStorage.getItem("currentUser");
    if (!userStr) {
      window.location.href = "index.html";
    } else {
      const user = JSON.parse(userStr);
      const userLevel = user.user_level || user.level;
      if (userLevel != 1 && userLevel != 2) {
        alert("Acceso denegado: No tienes permisos para gestionar categorías.");
        window.location.href = "dashboard.html";
      }
    }

    async function loadCategories() {
      const response = await window.api.apiCall('categories', 'getAllCategories');
      if (response.success) {
        const cats = response.data;
        const tbody = document.querySelector('#catTable tbody');
        tbody.innerHTML = '';

        cats.forEach(c => {
          const row = document.createElement('tr');
          const isSelected = selectedCategories.has(c.id);

          const userStr = localStorage.getItem("currentUser");
          const user = userStr ? JSON.parse(userStr) : {};
          const userLevel = user.user_level || user.level;

          row.innerHTML = `
            <td class="col-check" style="display: ${selectionMode ? 'table-cell' : 'none'}; text-align: center;">
              <input type="checkbox" class="cat-check" data-id="${c.id}" ${isSelected ? 'checked' : ''} onchange="handleRowCheck(this, ${c.id})">
            </td>
            <td>${c.name}</td>
            <td>${c.parent_name || '<span style="color: #a0aec0">Raíz</span>'}</td>
            <td class="actions">
              <button class="btn-action btn-edit" onclick="editCategory(${c.id})">Editar</button>
              ${userLevel == 1 ? `<button class="btn-action btn-delete" onclick="deleteCategory(${c.id})">Eliminar</button>` : ''}
            </td>
          `;
          tbody.appendChild(row);
        });
      }
    }

    async function updateParentSelect() {
      const response = await window.api.apiCall('categories', 'getAllCategories');
      if (response.success) {
        const cats = response.data;
        const select = document.getElementById('catParent');
        select.innerHTML = '<option value="">Ninguna (Categoría Raíz)</option>';

        cats.forEach(c => {
          const opt = new Option(c.name, c.id);
          select.add(opt);
        });
      }
    }

    function openCategoryModal(catId = null) {
      const userStr = localStorage.getItem("currentUser");
      const user = userStr ? JSON.parse(userStr) : {};
      const userLevel = user.user_level || user.level;

      if (userLevel != 1 && userLevel != 2) {
        alert("No tienes permisos para añadir o editar categorías.");
        return;
      }

      const modal = document.getElementById('catModal');
      const form = document.getElementById('catForm');
      const title = document.getElementById('modalTitle');

      form.reset();
      document.getElementById('catId').value = '';

      if (catId) {
        title.innerText = 'Editar Categoría';
        loadCategoryData(catId);
      } else {
        title.innerText = 'Nueva Categoría';
      }

      modal.style.display = 'flex';
    }

    async function loadCategoryData(id) {
      const response = await window.api.apiCall('categories', 'getCategoryById', id);
      if (response.success && response.data) {
        const cat = response.data;
        document.getElementById('catId').value = cat.id;
        document.getElementById('catName').value = cat.name;
        document.getElementById('catParent').value = cat.parent_id || '';
      }
    }

    function closeCategoryModal() {
      document.getElementById('catModal').style.display = 'none';
      document.getElementById('catForm').reset();
    }

    document.getElementById('catForm').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('catId').value;
      const data = {
        name: document.getElementById('catName').value,
        parent_id: document.getElementById('catParent').value || null
      };

      const method = id ? 'updateCategory' : 'addCategory';
      const payload = id ? { id: parseInt(id), ...data } : data;

      const response = await window.api.apiCall('categories', method, payload);
      if (response.success) {
        alert(id ? "Categoría actualizada" : "Categoría creada");
        closeCategoryModal();
        loadCategories();
      } else {
        alert("Error: " + response.message);
      }
    };

    async function deleteCategory(id) {
      if (confirm("¿Estás seguro de eliminar esta categoría? Si tiene productos asociados, la operación fallará.")) {
        const response = await window.api.apiCall('categories', 'deleteCategory', id);
        if (response.success) {
          loadCategories();
        } else {
          alert("Error: " + response.message);
        }
      }
    }

    // ✅ FIX: función editCategory faltante
    function editCategory(id) {
      openCategoryModal(id);
    }

    // ✅ FIX: Escape y click en backdrop para cerrar modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeCategoryModal();
    });
    document.getElementById('catModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('catModal')) closeCategoryModal();
    });

    window.onload = async () => {
      await updateParentSelect();
      await loadCategories();
    };
  </script>
</body>

</html>

</content>
